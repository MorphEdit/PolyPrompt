<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolyPrompt</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">PolyPrompt</div>
    <button id="new-chat" class="new-chat" type="button">+ แชทใหม่</button>
    <div class="sidebar-label">แชทที่บันทึกไว้</div>
    <ul id="chat-list" class="chat-list"></ul>
    <div id="old-sessions-label" class="sidebar-label" hidden>แชตเก่าจาก Claude Code</div>
    <ul id="old-sessions" class="chat-list old-sessions" hidden></ul>
  </aside>
  <main class="main">
    <header class="chat-header">
      <span id="folder-label" class="folder-label"></span>
      <button id="folder-button" class="folder-button" type="button" hidden>📁 เลือกโฟลเดอร์</button>
    </header>
    <div id="model-banner" class="banner" hidden></div>
    <div id="switch-banner" class="banner" hidden></div>
    <div id="error-banner" class="banner banner-error" hidden></div>
    <section id="messages" class="messages" aria-live="polite"></section>
    <div id="status-line" class="status-line" hidden></div>
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="พิมพ์ข้อความเป็นภาษาใดก็ได้… (Enter เพื่อส่ง, Shift+Enter ขึ้นบรรทัดใหม่)"></textarea>
      <div class="picker">
        <button id="picker" class="picker-button" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div id="picker-menu" class="picker-menu" hidden></div>
      </div>
      <button id="stop" class="stop-button" type="button" hidden>หยุด</button>
      <button id="send" type="submit" disabled>ส่ง</button>
    </form>
  </main>
  <div id="folder-dialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="folder-title">
      <div id="folder-title" class="dialog-title">เลือกโฟลเดอร์งาน</div>
      <div id="folder-path" class="folder-path"></div>
      <div id="folder-error" class="picker-error" hidden></div>
      <ul id="folder-list" class="folder-list"></ul>
      <div class="dialog-actions">
        <button id="folder-cancel" type="button">ยกเลิก</button>
        <button id="folder-choose" class="primary" type="button">เลือกโฟลเดอร์นี้</button>
      </div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
